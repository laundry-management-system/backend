spring:
  application:
    name: laundry
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/laundry}
    username: ${DB_USERNAME:laundry}
    password: ${DB_PASSWORD:laundry}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:laundry}

app:
  jwt:
    # Base64, >= 256 bit. Đổi qua biến môi trường JWT_SECRET khi deploy.
    secret: ${JWT_SECRET:bGF1bmRyeS1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbiE=}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  refresh-cookie:
    secure: ${REFRESH_COOKIE_SECURE:false}
    same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
    max-age: ${REFRESH_COOKIE_MAX_AGE:7}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  front-end-setup-password-url: ${FRONT_END_SETUP_PASSWORD_URL} # TODO: Gắn link trang nhập mật khẩu vào biến

springdoc:
  swagger-ui:
    path: /swagger-ui.html

mailjet:
  api-key: ${MAILJET_API_KEY:0cb65a9c47221ca2f997c1ef234955c1}
  secret-key: ${MAILJET_SECRET_KEY:8f0ab74011ee3a59d416689dd1fab681}
  sender-email: ${MAILJET_SENDER_EMAIL:phamvanthanhtunh2006@gmail.com}
  sender-name: Laundry

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG