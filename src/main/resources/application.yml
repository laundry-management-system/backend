spring:
  application:
    name: laundry
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/laundry?options=-c%20TimeZone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:laundry}
    password: ${DB_PASSWORD:laundry}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:laundry}

app:
  jwt:
    # Base64, >= 256 bit. Đổi qua biến môi trường JWT_SECRET khi deploy.
    secret: ${JWT_SECRET:bGF1bmRyeS1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbiE=}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  refresh-cookie:
    secure: ${REFRESH_COOKIE_SECURE:false}
    same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
    max-age: ${REFRESH_COOKIE_MAX_AGE:7}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  payment:
    vietqr:
      bank-id: ${VIETQR_BANK_ID:}
      account-no: ${VIETQR_ACCOUNT_NO:}
      account-name: ${VIETQR_ACCOUNT_NAME:}
      template: ${VIETQR_TEMPLATE:compact2}
      image-base-url: ${VIETQR_IMAGE_BASE_URL:https://img.vietqr.io/image}
  public-lookup:
    max-attempts: ${PUBLIC_LOOKUP_MAX_ATTEMPTS:10}
    window-seconds: ${PUBLIC_LOOKUP_WINDOW_SECONDS:60}
  orders:
    overdue-days: ${ORDER_OVERDUE_DAYS:7}
  frontend:
    public-lookup-url: ${PUBLIC_LOOKUP_URL:http://localhost:5173/track-order}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
